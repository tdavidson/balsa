name: Bug report
description: Report a reproducible problem in Balsa
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal information, or real financial data. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Provide the smallest reproducible example using synthetic data.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: Commit SHA or branch
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local development
        - Self-hosted production
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, browser, database, and model provider where relevant.
