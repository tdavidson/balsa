name: Feature request
description: Propose an improvement to Balsa
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What financial or operating problem should Balsa solve?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Describe the evidence, review, decision, calculation, and output involved.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Accounting and control considerations
      description: What must be deterministic, reviewable, authorized, or traceable?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
